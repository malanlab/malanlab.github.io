<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Malan Lab</title>

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

  <style>
    /* Optional safety styling for canvas */
    .brain-canvas {
      width: 100%;
      height: 420px;
      display: block;
      background: radial-gradient(circle at center, #0b0f1a, #05070d);
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.6);
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="nav-container">
    <div class="logo">
      MALAN LAB
    </div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/research/">Research</a>
      <a href="/people/">People</a>
      <a href="/publications/">Publications</a>
      <a href="/join/">Join Us</a>
    </nav>
  </div>
</header>

<!-- HERO CANVAS SHOULD EXIST IN YOUR PAGE CONTENT -->
<canvas class="brain-canvas"></canvas>

<main class="page">
  <div class="container">
    {{ content }}
  </div>
</main>

<footer class="footer">
  <div><strong>Malan Lab</strong></div>
  Computational Neuroscience • Brain Dynamics • Neuroengineering<br>
  IIT Jammu
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const canvas = document.querySelector(".brain-canvas");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = 420;
  }

  resize();
  window.addEventListener("resize", resize);

  let t = 0;

  // -----------------------------
  // Brain-shaped node layout
  // (two hemispheres)
  // -----------------------------
  const N = 26;
  const nodes = [];

  for (let i = 0; i < N; i++) {

    const hemisphere = i < N / 2 ? -1 : 1;
    const localIndex = i % (N / 2);

    const angle = (localIndex / (N / 2)) * Math.PI;

    const x = 0.5 + hemisphere * 0.18 * Math.cos(angle);
    const y = 0.5 + 0.28 * Math.sin(angle) * (0.8 + Math.random() * 0.4);

    nodes.push({
      x,
      y,
      phase: Math.random() * 10,
      vx: (Math.random() - 0.5) * 0.0015,
      vy: (Math.random() - 0.5) * 0.0015,
      hemi: hemisphere
    });
  }

  function sx(x) { return x * canvas.width; }
  function sy(y) { return y * canvas.height; }

  // -----------------------------
  // Brain-like connectivity rule
  // (strong local + weaker cross-hemisphere)
  // -----------------------------
  function connectivity(a, b) {

    const dx = a.x - b.x;
    const dy = a.y - b.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    const local = Math.exp(-dist * 6);

    const interHemisphereBoost =
      a.hemi !== b.hemi ? 0.6 : 1.0;

    const oscillation =
      Math.sin(t * 0.02 + a.phase - b.phase);

    return local * interHemisphereBoost * (0.6 + 0.4 * oscillation);
  }

  function draw() {

    // -----------------------------
    // brain background (soft cortex feel)
    // -----------------------------
    const grad = ctx.createRadialGradient(
      canvas.width * 0.5, canvas.height * 0.45, 30,
      canvas.width * 0.5, canvas.height * 0.5, canvas.width
    );

    grad.addColorStop(0, "#0d1b2a");
    grad.addColorStop(0.5, "#08101a");
    grad.addColorStop(1, "#04060a");

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // subtle noise (brain texture)
    for (let i = 0; i < 80; i++) {
      ctx.fillStyle = "rgba(255,255,255,0.015)";
      ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
    }

    // -----------------------------
    // edges (connectivity inside brain)
    // -----------------------------
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {

        const a = nodes[i];
        const b = nodes[j];

        const w = connectivity(a, b);

        const alpha = Math.pow(Math.max(0, w), 1.6) * 0.6;

        if (alpha < 0.03) continue;

        ctx.beginPath();
        ctx.moveTo(sx(a.x), sy(a.y));
        ctx.lineTo(sx(b.x), sy(b.y));

        const hue = 185 + w * 50;

        ctx.strokeStyle = `hsla(${hue}, 95%, 65%, ${alpha})`;
        ctx.lineWidth = 0.5 + w * 2.0;

        ctx.stroke();
      }
    }

    // -----------------------------
    // nodes (brain regions)
    // -----------------------------
    for (let i = 0; i < N; i++) {

      const n = nodes[i];

      // brain-like slow oscillation + drift
      n.x += n.vx + 0.002 * Math.sin(t * 0.01 + n.phase);
      n.y += n.vy + 0.002 * Math.cos(t * 0.012 + n.phase);

      // soft attractor (keeps brain shape stable)
      n.x += (0.5 - n.x) * 0.002;
      n.y += (0.5 - n.y) * 0.002;

      const activity = 0.5 + 0.5 * Math.sin(t * 0.03 + n.phase);

      const x = sx(n.x);
      const y = sy(n.y);

      // node body
      ctx.beginPath();
      ctx.arc(x, y, 2.5 + activity * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 255, 210, ${0.35 + activity * 0.5})`;
      ctx.fill();

      // glow ring (brain activation)
      ctx.beginPath();
      ctx.arc(x, y, 6 + activity * 6, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0, 180, 255, ${0.06 + activity * 0.12})`;
      ctx.stroke();
    }

    t += 1;
    requestAnimationFrame(draw);
  }

  draw();
});
</script>
</body>
</html>
