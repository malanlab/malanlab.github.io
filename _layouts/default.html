<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Malan Lab</title>

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

  <style>
    /* Optional safety styling for canvas */
    .brain-canvas {
      width: 100%;
      height: 420px;
      display: block;
      background: radial-gradient(circle at center, #0b0f1a, #05070d);
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.6);
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="nav-container">
    <div class="logo">
      MALAN LAB
    </div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/research/">Research</a>
      <a href="/people/">People</a>
      <a href="/publications/">Publications</a>
      <a href="/join/">Join Us</a>
    </nav>
  </div>
</header>

<!-- HERO CANVAS SHOULD EXIST IN YOUR PAGE CONTENT -->
<canvas class="brain-canvas"></canvas>

<main class="page">
  <div class="container">
    {{ content }}
  </div>
</main>

<footer class="footer">
  <div><strong>Malan Lab</strong></div>
  Computational Neuroscience • Brain Dynamics • Neuroengineering<br>
  IIT Jammu
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const canvas = document.querySelector(".brain-canvas");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = 420;
  }

  resize();
  window.addEventListener("resize", resize);

  let t = 0;

  // --------- helper: smoothed noise (1/f like drift) ----------
  function noise(x) {
    return (
      Math.sin(x * 0.013) * 1.2 +
      Math.sin(x * 0.031) * 0.6 +
      Math.sin(x * 0.057) * 0.3
    );
  }

  // --------- helper: bursty oscillation (alpha/beta packets) ----------
  function burst(x, phase) {
    const env =
      Math.exp(-Math.pow(Math.sin((x + t) * 0.001 + phase), 2) * 6);

    return env * Math.sin((x + t) * 0.03 + phase);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const channels = 10;
    const spacing = canvas.height / (channels + 1);

    // subtle dark neuro background glow
    const grad = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, 50,
      canvas.width / 2, canvas.height / 2, canvas.width
    );
    grad.addColorStop(0, "#0b1220");
    grad.addColorStop(1, "#05070d");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let c = 0; c < channels; c++) {

      ctx.beginPath();

      const phase = c * 0.8;

      // EEG-like channel colors (not neon random)
      const hue = 190 + c * 6; // cyan → blue shift
      const alpha = 0.35;

      ctx.strokeStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
      ctx.lineWidth = 1.2;

      let first = true;

      for (let x = 0; x < canvas.width; x += 3) {

        // --- realistic EEG composition ---
        let baseline = noise(x * 0.8) * 2.5;
        let alphaRhythm = Math.sin((x + t) * 0.012 + phase) * 6;
        let betaBurst = burst(x, phase) * 10;

        // small random micro-fluctuation (MEG/EEG noise floor)
        let microNoise = (Math.random() - 0.5) * 1.2;

        let y =
          spacing * (c + 1) +
          baseline +
          alphaRhythm +
          betaBurst +
          microNoise;

        if (first) {
          ctx.moveTo(x, y);
          first = false;
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();
    }

    t += 1.2;
    requestAnimationFrame(draw);
  }

  draw();
});
</script>
</body>
</html>
