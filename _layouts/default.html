<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Malan Lab</title>

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

  <style>
    /* Optional safety styling for canvas */
    .brain-canvas {
      width: 100%;
      height: 420px;
      display: block;
      background: radial-gradient(circle at center, #0b0f1a, #05070d);
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.6);
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="nav-container">
    <div class="logo">
      MALAN LAB
    </div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/research/">Research</a>
      <a href="/people/">People</a>
      <a href="/publications/">Publications</a>
      <a href="/join/">Join Us</a>
    </nav>
  </div>
</header>

<!-- HERO CANVAS SHOULD EXIST IN YOUR PAGE CONTENT -->
<canvas class="brain-canvas"></canvas>

<main class="page">
  <div class="container">
    {{ content }}
  </div>
</main>

<footer class="footer">
  <div><strong>Malan Lab</strong></div>
  Computational Neuroscience • Brain Dynamics • Neuroengineering<br>
  IIT Jammu
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const canvas = document.querySelector(".brain-canvas");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = 420;
  }

  resize();
  window.addEventListener("resize", resize);

  // -----------------------------
  // Brain network configuration
  // -----------------------------
  const N = 14; // nodes (electrodes / ROIs)
  const nodes = [];

  let t = 0;

  // initialize nodes in a pseudo-brain shape (ellipse)
  for (let i = 0; i < N; i++) {
    const angle = (i / N) * Math.PI * 2;

    nodes.push({
      x: 0.5 + 0.35 * Math.cos(angle),
      y: 0.5 + 0.25 * Math.sin(angle),
      vx: (Math.random() - 0.5) * 0.002,
      vy: (Math.random() - 0.5) * 0.002,
      phase: Math.random() * 10
    });
  }

  function scaleX(x) {
    return x * canvas.width;
  }

  function scaleY(y) {
    return y * canvas.height;
  }

  function connectionStrength(a, b) {
    // dynamic functional connectivity (oscillatory + slow drift)
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    const oscillation = Math.sin(t * 0.02 + a.phase - b.phase);
    const slowDrift = Math.sin(t * 0.005 + dist * 10);

    return Math.max(0, oscillation * 0.6 + slowDrift * 0.4);
  }

  function draw() {

    // background (deep brain space)
    const grad = ctx.createRadialGradient(
      canvas.width * 0.5, canvas.height * 0.5, 20,
      canvas.width * 0.5, canvas.height * 0.5, canvas.width
    );
    
    grad.addColorStop(0, "#0d1b2a");
    grad.addColorStop(0.4, "#08101a");
    grad.addColorStop(1, "#04060a");
    
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // subtle noise layer (VERY important for realism)
    for (let i = 0; i < 60; i++) {
      ctx.fillStyle = "rgba(255,255,255,0.02)";
      ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
    }

    // -----------------------------
    // draw edges (connectivity)
    // -----------------------------
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
    
        const a = nodes[i];
        const b = nodes[j];
    
        const w = connectionStrength(a, b);
    
        // soft threshold instead of hard cut
        const alpha = Math.pow(w, 1.5) * 0.7;
    
        if (alpha < 0.05) continue;
    
        const x1 = scaleX(a.x);
        const y1 = scaleY(a.y);
        const x2 = scaleX(b.x);
        const y2 = scaleY(b.y);
    
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
    
        // smoother neuro color mapping
        const hue = 200 + w * 60;
    
        ctx.strokeStyle = `hsla(${hue}, 95%, 65%, ${alpha})`;
        ctx.lineWidth = 0.6 + w * 2.0;
    
        ctx.stroke();
      }
    }

    // -----------------------------
    // update + draw nodes
    // -----------------------------
    for (let i = 0; i < N; i++) {
    
      const n = nodes[i];
    
      // oscillatory drift (brain state)
      n.x += n.vx + 0.002 * Math.sin(t * 0.01 + n.phase);
      n.y += n.vy + 0.002 * Math.cos(t * 0.012 + n.phase);
    
      // soft attractor to center (prevents runaway)
      n.x += (0.5 - n.x) * 0.002;
      n.y += (0.5 - n.y) * 0.002;
    
      const activity = 0.5 + 0.5 * Math.sin(t * 0.03 + n.phase);
    
      const px = scaleX(n.x);
      const py = scaleY(n.y);
    
      ctx.beginPath();
      ctx.arc(px, py, 2 + activity * 3, 0, Math.PI * 2);
    
      ctx.fillStyle = `rgba(0, 255, 210, ${0.35 + activity * 0.5})`;
      ctx.fill();
    
      ctx.beginPath();
      ctx.arc(px, py, 6 + activity * 5, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0, 180, 255, ${0.06 + activity * 0.1})`;
      ctx.stroke();
    }

    t += 1;
    requestAnimationFrame(draw);
  }

  draw();
});
</script>
</body>
</html>
