<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Malan Lab</title>

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

  <style>
    /* Optional safety styling for canvas */
    .brain-canvas {
      width: 100%;
      height: 420px;
      display: block;
      background: radial-gradient(circle at center, #0b0f1a, #05070d);
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.6);
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="nav-container">
    <div class="logo">
      MALAN LAB
    </div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/research/">Research</a>
      <a href="/people/">People</a>
      <a href="/publications/">Publications</a>
      <a href="/join/">Join Us</a>
    </nav>
  </div>
</header>

<!-- HERO CANVAS SHOULD EXIST IN YOUR PAGE CONTENT -->
<canvas class="brain-canvas"></canvas>

<main class="page">
  <div class="container">
    {{ content }}
  </div>
</main>

<footer class="footer">
  <div><strong>Malan Lab</strong></div>
  Computational Neuroscience • Brain Dynamics • Neuroengineering<br>
  IIT Jammu
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const canvas = document.querySelector(".brain-canvas");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = 420;
  }

  resize();
  window.addEventListener("resize", resize);

  let t = 0;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const channels = 8;
    const spacing = canvas.height / (channels + 1);

    for (let c = 0; c < channels; c++) {

      ctx.beginPath();

      const alpha = 0.15 + c * 0.08;
      ctx.strokeStyle = `rgba(0, 255, 200, ${alpha})`;
      ctx.lineWidth = 1.5;

      for (let x = 0; x < canvas.width; x += 4) {

        const phase = c * 0.7;

        let noise = (Math.random() - 0.5) * 3;

        let signal =
          Math.sin((x + t) * 0.02 + phase) * 10 +
          Math.sin((x + t) * 0.005 + phase) * 25;

        let y =
          spacing * (c + 1) +
          signal +
          noise;

        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.stroke();
    }

    t += 2;
    requestAnimationFrame(draw);
  }

  draw();
});
</script>

</body>
</html>
