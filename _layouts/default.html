<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Malan Lab</title>

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

  <style>
    /* Optional safety styling for canvas */
    .brain-canvas {
      width: 100%;
      height: 420px;
      display: block;
      background: radial-gradient(circle at center, #0b0f1a, #05070d);
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.6);
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="nav-container">
    <div class="logo">
      MALAN LAB
    </div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/research/">Research</a>
      <a href="/people/">People</a>
      <a href="/publications/">Publications</a>
      <a href="/join/">Join Us</a>
    </nav>
  </div>
</header>

<!-- HERO CANVAS SHOULD EXIST IN YOUR PAGE CONTENT -->
<canvas class="brain-canvas"></canvas>

<main class="page">
  <div class="container">
    {{ content }}
  </div>
</main>

<footer class="footer">
  <div><strong>Malan Lab</strong></div>
  Computational Neuroscience • Brain Dynamics • Neuroengineering<br>
  IIT Jammu
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const canvas = document.querySelector(".brain-canvas");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = 420;
  }

  resize();
  window.addEventListener("resize", resize);

  // -----------------------------
  // Brain network configuration
  // -----------------------------
  const N = 14; // nodes (electrodes / ROIs)
  const nodes = [];

  let t = 0;

  // initialize nodes in a pseudo-brain shape (ellipse)
  for (let i = 0; i < N; i++) {
    const angle = (i / N) * Math.PI * 2;

    nodes.push({
      x: 0.5 + 0.35 * Math.cos(angle),
      y: 0.5 + 0.25 * Math.sin(angle),
      vx: (Math.random() - 0.5) * 0.002,
      vy: (Math.random() - 0.5) * 0.002,
      phase: Math.random() * 10
    });
  }

  function scaleX(x) {
    return x * canvas.width;
  }

  function scaleY(y) {
    return y * canvas.height;
  }

  function connectionStrength(a, b) {
    // dynamic functional connectivity (oscillatory + slow drift)
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    const oscillation = Math.sin(t * 0.02 + a.phase - b.phase);
    const slowDrift = Math.sin(t * 0.005 + dist * 10);

    return Math.max(0, oscillation * 0.6 + slowDrift * 0.4);
  }

  function draw() {

    // background (deep brain space)
    const grad = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, 50,
      canvas.width / 2, canvas.height / 2, canvas.width
    );

    grad.addColorStop(0, "#0b1220");
    grad.addColorStop(1, "#05070d");

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // -----------------------------
    // draw edges (connectivity)
    // -----------------------------
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {

        const a = nodes[i];
        const b = nodes[j];

        const w = connectionStrength(a, b);

        if (w < 0.35) continue;

        ctx.beginPath();
        ctx.moveTo(scaleX(a.x), scaleY(a.y));
        ctx.lineTo(scaleX(b.x), scaleY(b.y));

        const alpha = 0.05 + w * 0.6;

        // neuro connectivity color (cyan-blue spectrum)
        const hue = 190 + w * 40;

        ctx.strokeStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
        ctx.lineWidth = 1.2 * w;

        ctx.stroke();
      }
    }

    // -----------------------------
    // update + draw nodes
    // -----------------------------
    for (let i = 0; i < N; i++) {

      const n = nodes[i];

      // subtle drift (like brain state fluctuation)
      n.x += n.vx;
      n.y += n.vy;

      // soft boundary constraint
      n.x = 0.5 + (n.x - 0.5) * 0.995;
      n.y = 0.5 + (n.y - 0.5) * 0.995;

      // node activity (EEG-like power)
      const activity =
        0.5 +
        0.5 * Math.sin(t * 0.03 + n.phase);

      const px = scaleX(n.x);
      const py = scaleY(n.y);

      // node glow
      ctx.beginPath();
      ctx.arc(px, py, 2.5 + activity * 2.5, 0, Math.PI * 2);

      ctx.fillStyle = `rgba(0, 255, 210, ${0.4 + activity * 0.4})`;
      ctx.fill();

      // outer glow ring
      ctx.beginPath();
      ctx.arc(px, py, 6 + activity * 4, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0, 200, 255, ${0.08 + activity * 0.1})`;
      ctx.stroke();
    }

    t += 1;
    requestAnimationFrame(draw);
  }

  draw();
});
</script>
</body>
</html>
